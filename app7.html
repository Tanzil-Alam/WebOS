<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notepad</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background: #f4f4f4;
            position: fixed;
        }

        .box {
            width: 500px;
            height: 350px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input,
        button {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>

<body onload="document.getElementById('savedText').innerText = localStorage.getItem('txt') || '';">

    <div class="box">
        <h2>Notepad</h2>
        <input type="text" id="userInput" placeholder="Type text here...">
        <div class="btn-group">
            <button
                onclick="localStorage.setItem('txt', document.getElementById('userInput').value); document.getElementById('savedText').innerText = localStorage.getItem('txt');">Save</button>
            <button
                onclick="localStorage.removeItem('txt'); document.getElementById('savedText').innerText = ''; document.getElementById('userInput').value = '';">Clear</button>
        </div>
        <p>Saved: <span id="savedText"></span></p>
    </div>

</body>

</html>
