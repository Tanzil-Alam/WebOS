<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="calculator.css">

</head>

<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm bg-[#1a1a1a] p-6 rounded-2xl shadow-xl flex flex-col gap-4">

        <input type="text" id="exprInput" placeholder="Example: 12 * 8"
            class="w-full bg-[#121212] border border-zinc-700 text-white placeholder-zinc-500 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-zinc-500 transition-colors">

        <button id="calcBtn"
            class="w-fit bg-[#262626] hover:bg-[#333333] text-white font-medium px-6 py-2.5 rounded-xl border border-zinc-700 transition-colors cursor-pointer">
            Calculate
        </button>

        <div id="resultArea" class="text-zinc-400 text-sm mt-1">
            Your answer appears here.
        </div>

    </div>

    <script src="calculator.js"></script>

</body>

</html>
