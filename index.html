<!DOCTYPE html>
<html lang="en">

<head>

    <title>Desktop</title>
</head>
<link rel="stylesheet" href="style.css">

<body>

    <div
        style="width: 100%; height: 40px; background-color: hwb(0 100% 0% / 0.295); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box;">
        <div id="clock" style="font-size: 20px;"></div>

        <div id="Date" style="font-size: 20px;"></div>
    </div>



    <div
        style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 450px; height: 60px; background-color: hwb(279 69% 1% / 0.352); border-radius: 12px; display: flex; align-items: center; justify-content: space-evenly;">
        <div class="icon6" onclick="openWindow('App 6', 'app6.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px;  cursor: pointer;">
