<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop</title>
</head>
<style>
    body {
        margin: 0;
        background-image: url('wallpaper.jfif');
        background-attachment: fixed;
        background-position: center center;
        background-repeat: no-repeat;
        background-size: cover;
    }

    .settings:hover {
        transform: scale(1.1);
    }

    .icon1:hover {
        transform: scale(1.1);
    }

    .icon3:hover {
        transform: scale(1.1);
    }

    .icon4:hover {
        transform: scale(1.1);
    }

    .icon5:hover {
        transform: scale(1.1);
    }

    .icon6:hover {
        transform: scale(1.1);
    }

    .icon7:hover {
        transform: scale(1.1);
    }

    .icon8:hover {
        transform: scale(1.1);
    }

    .icon9:hover {
        transform: scale(1.1);
    }

    .icon10:hover {
        transform: scale(1.1);
    }
</style>

<body>
    <div
        style="width: 100%; height: 40px; background-color: hwb(0 100% 0% / 0.295); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box;">
        <div id="clock" style="font-size: 20px;"></div>
        <div id="name" style="font-size: 20px; font-weight: bold;">GalaxyOS</div>
        <div id="Date" style="font-size: 20px;"></div>
    </div>

    <div
        style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 450px; height: 60px; background-color: hwb(279 69% 1% / 0.352); border-radius: 12px; display: flex; align-items: center; justify-content: space-evenly;">

        <div class="icon7" onclick="openWindow('App 7', 'App7.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px;  cursor: pointer;">
            <img src="icon9.png" style="width: 44px; height: 44px;">
        </div>
        <div class="icon8" onclick="openWindow('App 8', 'App8.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px;  cursor: pointer;">
            <img src="icon1.png" style="width: 44px; height: 44px;">

        </div>
        <div class="icon9" onclick="openWindow('App 9', 'App9.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px;  cursor: pointer;">
            <img src="icon4.png" style="width: 44px; height: 44px;">
        </div>


        <script>
            const updateClock = () => {
                document.getElementById('clock').textContent = new Date().toLocaleTimeString();
            };
            setInterval(updateClock, 1000);
            updateClock();

            const updateDate = () => {
                document.getElementById('Date').textContent = new Date().toLocaleDateString();
            };
            setInterval(updateDate, 1000);
            updateDate();

            let count = 0;
            let topZ = 100;

            function openWindow(title, path = 'about:blank') {
                count++;
                topZ++;

                let win = document.createElement('div');

                win.style.cssText = `
                position: absolute;
                width: 500px;
                height: 350px;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.3);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                z-index: ${topZ};
                top: ${70 + (count % 6) * 20}px;
                left: ${90 + (count % 6) * 20}px;
            `;

                win.onmousedown = () => win.style.zIndex = ++topZ;

                win.innerHTML = `
                <div class="window-header" style="height: 30px; background: #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; user-select: none; cursor: move;">
                    <span style="font-size: 12px; font-weight: bold; font-family: sans-serif; color: #333;">${title}</span>
                    <div onclick="this.parentElement.parentElement.remove()" style="width: 12px; height: 12px; background: #ff5f56; border-radius: 50%; cursor: pointer;"></div>
                </div>
                <div style="flex: 1; position: relative;">
                    <iframe src="${path}" style="width: 100%; height: 100%; border: none; background: #fff;"></iframe>
                </div>
            `;

                let header = win.querySelector('.window-header');
                let iframe = win.querySelector('iframe');

                header.onmousedown = (e) => {
                    if (e.target.tagName === 'DIV' && e.target !== header) return; // Prevent drag when clicking close button
                    let shiftX = e.clientX - win.getBoundingClientRect().left;
                    let shiftY = e.clientY - win.getBoundingClientRect().top;

                    iframe.style.pointerEvents = 'none'; // Disable iframe mouse events during drag

                    function moveAt(pageX, pageY) {
                        win.style.left = pageX - shiftX + 'px';
                        win.style.top = pageY - shiftY + 'px';
                    }

                    function onMouseMove(e) {
                        moveAt(e.pageX, e.pageY);
                    }

                    document.addEventListener('mousemove', onMouseMove);

                    document.onmouseup = () => {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.onmouseup = null;
                        iframe.style.pointerEvents = 'auto'; // Re-enable iframe events
                    };
                };

                document.body.appendChild(win);
            }
        </script>
</body>

</html>
